version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Keep TypeScript at the project's pin until the Vue type checker is upgraded.
      - dependency-name: typescript
      # Keep PrimeVue on 4.3 until the task drawer supports newer versions.
      - dependency-name: primevue
        versions: [">=4.4.0-0"]
      - dependency-name: "@primeuix/themes"
        versions: [">=2.0.0-0"]
      # PrimeIcons 8 moved off the MIT license.
      - dependency-name: primeicons
        versions: [">=8.0.0-0"]
    groups:
      frontend-dependencies:
        patterns: ["*"]
