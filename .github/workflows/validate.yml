name: Validate release candidate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production package
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install production dependencies
        run: |
          # Match browser runners and avoid the slow cloud-local HTTP mirror.
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install --yes build-essential libpam0g-dev 7zip ffmpeg
      - name: Validate and package
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/validate-production.sh
      - name: Record package provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release-artifact.py create --directory dist \
            --version "$(cat releases/RELEASE_VERSION)" --commit "$SOURCE_COMMIT"
      - name: Preserve tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/webfile-*-linux-amd64.tar.gz
            dist/webfile-*-linux-amd64.tar.gz.sha256
            dist/release-candidate.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  chromium:
    name: Chromium
    if: github.event.repository.private == false
    uses: ./.github/workflows/browser-validation.yml
    with:
      project: chromium-touch
      engine: chromium

  webkit:
    name: WebKit
    if: github.event.repository.private == false
    uses: ./.github/workflows/browser-validation.yml
    with:
      project: webkit-ipad
      engine: webkit
