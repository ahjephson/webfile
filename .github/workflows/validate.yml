name: Validate release candidate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production package
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, home-personal-amd64, webfile-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Validate and package
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/validate-production.sh
      - name: Record package provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release-artifact.py create --directory dist \
            --version "$(cat RELEASE_VERSION)" --commit "$SOURCE_COMMIT"
      - name: Preserve tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/webfile-*-linux-amd64.tar.gz
            dist/webfile-*-linux-amd64.tar.gz.sha256
            dist/release-candidate.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  chromium:
    name: Chromium
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/browser-validation.yml
    with:
      project: chromium-touch
      engine: chromium

  webkit:
    name: WebKit
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/browser-validation.yml
    with:
      project: webkit-ipad
      engine: webkit
