name: Release Linux binary

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Validated bare semantic-version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Find successful validation for this main commit
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$(cat RELEASE_VERSION)" != "$RELEASE_TAG" ]]; then
            echo 'Tag must match the version validated in RELEASE_VERSION.' >&2
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" != "$source_commit" ]]; then
            echo 'Checked-out commit does not match the release tag.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$source_commit" origin/main
          validation_run="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$source_commit" -f branch=main -f status=success \
            | python3 scripts/release-artifact.py select-run --commit "$source_commit")"
          if [[ ! "$validation_run" =~ ^[0-9]+$ ]]; then
            echo 'No successful main validation for this exact commit. Validate before tagging.' >&2
            exit 1
          fi
          echo "run=$validation_run" >> "$GITHUB_OUTPUT"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Download previously tested package
        env:
          VALIDATION_RUN: ${{ steps.validation.outputs.run }}
          SOURCE_COMMIT: ${{ steps.validation.outputs.commit }}
        run: |
          gh run download "$VALIDATION_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-$SOURCE_COMMIT" --dir dist/tested-release

      - name: Verify version, source commit and package hashes
        env:
          SOURCE_COMMIT: ${{ steps.validation.outputs.commit }}
        run: |
          python3 scripts/release-artifact.py verify --directory dist/tested-release \
            --version "$RELEASE_TAG" --commit "$SOURCE_COMMIT"

      - name: Publish verified package without rebuilding
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/tested-release/webfile-$RELEASE_TAG-linux-amd64.tar.gz" \
            "dist/tested-release/webfile-$RELEASE_TAG-linux-amd64.tar.gz.sha256" \
            --verify-tag --notes-file "RELEASE_NOTES_$RELEASE_TAG.md" \
            --title "WebFile $RELEASE_TAG"
