site_name: WebFile
site_description: Install, configure and use WebFile, a Linux file manager for your browser.
site_url: https://ahjephson.dev/webfile/docs/
repo_url: https://github.com/ahjephson/webfile
repo_name: ahjephson/webfile
edit_uri: ''
use_directory_urls: false
strict: true

theme:
  name: material
  font: false
  logo: assets/webfile.svg
  favicon: assets/webfile.svg
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra:
  homepage: ../
  generator: false

extra_css:
  - assets/brand.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Overview: index.md
  - Get started:
      - Install on Linux: installation.md
      - Configuration: configuration.md
      - Authentication and TLS: authentication.md
      - Reverse proxy: reverse-proxy.md
  - Use WebFile:
      - Browse and manage files: files.md
      - Transfers and tasks: tasks.md
      - Previews and archives: previews.md
      - Troubleshooting: troubleshooting.md
  - Help:
      - Security policy: security.md
      - Report a problem: https://github.com/ahjephson/webfile/issues
      - Releases: https://github.com/ahjephson/webfile/releases
