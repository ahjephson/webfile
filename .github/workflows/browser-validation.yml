name: Browser validation

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      engine:
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    name: ${{ inputs.engine }} shard ${{ matrix.shard }}/4
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes 7zip ffmpeg
          npm --prefix web ci --no-audit --no-fund
          cd web
          npx playwright install --with-deps "$ENGINE"
      - name: Validate browser workflows and mounted path
        env:
          PROJECT: ${{ inputs.project }}
          WEBFILE_E2E_SHARD: ${{ matrix.shard }}/4
        run: bash scripts/validate-browser.sh "$PROJECT"
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-diagnostics-${{ inputs.project }}-${{ matrix.shard }}-of-4-${{ github.run_attempt }}
          path: |
            dist/validation/${{ inputs.project }}/**/*.log
            dist/validation/${{ inputs.project }}/**/*.json
            dist/validation/${{ inputs.project }}/**/test-results/
            dist/validation/${{ inputs.project }}/**/test-results-prefix/
          if-no-files-found: ignore
          retention-days: 7
